<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 // SYSTEM ERROR - zney</title>
  <link rel="icon" type="image/png" href="./hacker.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #03070a;
      color: #e0f8ff;
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      user-select: none;
    }

    /* CRT Monitor Scanlines Effect */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.45) 0px,
        rgba(0, 0, 0, 0.45) 2px,
        transparent 2px,
        transparent 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    /* Subtle Green CRT Glow & Vignette */
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0, 255, 170, 0.05) 0%, rgba(0, 0, 0, 0.85) 80%);
      pointer-events: none;
      z-index: 9;
    }

    .container {
      position: relative;
      z-index: 20;
      text-align: center;
      padding: 2rem;
      max-width: 650px;
      width: 100%;
    }

    /* Top ERROR text */
    .error-label {
      font-family: 'VT323', monospace;
      font-size: 2.2rem;
      letter-spacing: 0.35em;
      color: #00ffaa;
      text-shadow: 0 0 10px rgba(0, 255, 170, 0.6);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      animation: flicker 3s infinite;
    }

    /* Massive 404 Glitch Text */
    .glitch-wrapper {
      position: relative;
      display: inline-block;
      margin: 0.5rem 0 1.5rem;
    }

    .glitch {
      font-family: 'VT323', monospace;
      font-size: clamp(8rem, 25vw, 14rem);
      font-weight: bold;
      line-height: 0.8;
      color: #ffffff;
      letter-spacing: 0.05em;
      position: relative;
      text-shadow: 0 0 20px rgba(0, 255, 170, 0.5);
    }

    .glitch::before,
    .glitch::after {
      content: "404";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #03070a;
    }

    /* Red chromatic aberration slice */
    .glitch::before {
      left: -4px;
      text-shadow: -3px 0 #ff0055;
      clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
      animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
    }

    /* Cyan chromatic aberration slice */
    .glitch::after {
      left: 4px;
      text-shadow: 3px 0 #00ffff;
      clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
      animation: glitch-anim-2 3s infinite linear alternate-reverse;
    }

    /* Bottom PAGE NOT FOUND */
    .not-found {
      font-family: 'VT323', monospace;
      font-size: clamp(1.8rem, 6vw, 3rem);
      letter-spacing: 0.25em;
      color: #ffffff;
      text-shadow: -2px 0 #ff0055, 2px 0 #00ffff, 0 0 15px rgba(255, 255, 255, 0.8);
      margin-bottom: 2.5rem;
      text-transform: uppercase;
    }

    /* Terminal Log Box */
    .terminal-box {
      background: rgba(5, 15, 20, 0.85);
      border: 1px solid rgba(0, 255, 170, 0.3);
      border-left: 3px solid #00ffaa;
      padding: 1.25rem;
      border-radius: 4px;
      text-align: left;
      font-size: 0.9rem;
      line-height: 1.6;
      color: #a0d8ef;
      box-shadow: 0 0 25px rgba(0, 255, 170, 0.1);
      margin-bottom: 2.5rem;
      position: relative;
    }

    .terminal-box .prompt {
      color: #00ffaa;
      font-weight: bold;
    }

    .terminal-box .err-code {
      color: #ff0055;
    }

    /* Hacker CTA Button */
    .btn-return {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 14px 32px;
      background: transparent;
      color: #00ffaa;
      border: 2px solid #00ffaa;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1rem;
      font-weight: bold;
      text-decoration: none;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 255, 170, 0.2);
    }

    .btn-return:hover {
      background: #00ffaa;
      color: #03070a;
      box-shadow: 0 0 30px rgba(0, 255, 170, 0.8);
      transform: translateY(-2px);
    }

    .btn-return:active {
      transform: translateY(0);
    }

    /* Keyframes */
    @keyframes flicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
        opacity: 1;
      }
      20%, 24%, 55% {
        opacity: 0.3;
      }
    }

    @keyframes glitch-anim-1 {
      0% { clip-path: polygon(0 20%, 100% 20%, 100% 30%, 0 30%); transform: translate(-4px, -2px); }
      20% { clip-path: polygon(0 60%, 100% 60%, 100% 65%, 0 65%); transform: translate(4px, 2px); }
      40% { clip-path: polygon(0 40%, 100% 40%, 100% 50%, 0 50%); transform: translate(-2px, 4px); }
      60% { clip-path: polygon(0 80%, 100% 80%, 100% 85%, 0 85%); transform: translate(2px, -4px); }
      80% { clip-path: polygon(0 10%, 100% 10%, 100% 15%, 0 15%); transform: translate(-4px, 2px); }
      100% { clip-path: polygon(0 30%, 100% 30%, 100% 45%, 0 45%); transform: translate(4px, -2px); }
    }

    @keyframes glitch-anim-2 {
      0% { clip-path: polygon(0 65%, 100% 65%, 100% 75%, 0 75%); transform: translate(4px, 2px); }
      20% { clip-path: polygon(0 15%, 100% 15%, 100% 25%, 0 25%); transform: translate(-4px, -2px); }
      40% { clip-path: polygon(0 50%, 100% 50%, 100% 55%, 0 55%); transform: translate(4px, -4px); }
      60% { clip-path: polygon(0 85%, 100% 85%, 100% 95%, 0 95%); transform: translate(-2px, 4px); }
      80% { clip-path: polygon(0 35%, 100% 35%, 100% 40%, 0 40%); transform: translate(2px, -2px); }
      100% { clip-path: polygon(0 70%, 100% 70%, 100% 80%, 0 80%); transform: translate(-4px, 2px); }
    }

    /* Binary matrix background canvas */
    #matrix-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      opacity: 0.15;
    }
  </style>
</head>
<body>
  <canvas id="matrix-canvas"></canvas>

  <div class="container">
    <div class="error-label">ERROR</div>
    <div class="glitch-wrapper">
      <div class="glitch">404</div>
    </div>
    <div class="not-found">PAGE NOT FOUND</div>

    <div class="terminal-box">
      <div><span class="prompt">root@zney-sys:~$</span> locate target_url</div>
      <div>[<span class="err-code">ERR_404_VOID</span>] Requested matrix node does not exist or has been declassified.</div>
      <div><span class="prompt">></span> Status: <span style="color: #ff0055;">CONNECTION TERMINATED</span></div>
      <div><span class="prompt">></span> Solution: Re-routing to secure base sector...</div>
    </div>

    <a href="./" class="btn-return">
      <span>[ ➔ RETURN TO MAINFRAME ]</span>
    </a>
  </div>

  <script>
    // Hacker Matrix Rain Effect in background
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ$#@%&*<>/\\|{}[]';
    const fontSize = 14;
    let columns = Math.floor(canvas.width / fontSize);
    let drops = Array(columns).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(3, 7, 10, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#00ffaa';
      ctx.font = `${fontSize}px 'Share Tech Mono', monospace`;

      if (columns !== Math.floor(canvas.width / fontSize)) {
        columns = Math.floor(canvas.width / fontSize);
        drops = Array(columns).fill(1);
      }

      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    setInterval(drawMatrix, 40);
  </script>
</body>
</html>
