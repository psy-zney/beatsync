name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Never let two pushes build/reload the same VPS at the same time.
concurrency:
  group: beatsync-production-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy to VPS
        # Pin the action commit so a moved tag cannot gain access to the VPS key.
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          script: |
            export PATH="$HOME/.bun/bin:/usr/local/bin:$PATH"
            cd ~/beatsync
            git pull --ff-only origin main
            command -v pm2 >/dev/null || bun add --global pm2
            sudo env \
              PATH="$PATH" \
              PM2_BIN="$(command -v pm2)" \
              DEPLOY_USER="$(id -un)" \
              DEPLOY_HOME="$HOME" \
              bash scripts/configure-oracle-memory.sh
            SKIP_PULL=1 bash update.sh
