name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Never let two pushes build/reload the same VPS at the same time.
concurrency:
  group: beatsync-production-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_FINGERPRINT: ${{ secrets.VPS_FINGERPRINT }}
        run: |
          missing=""
          [ -n "$VPS_HOST" ] || missing="$missing VPS_HOST"
          [ -n "$VPS_USERNAME" ] || missing="$missing VPS_USERNAME"
          [ -n "$VPS_SSH_KEY" ] || missing="$missing VPS_SSH_KEY"
          [ -n "$VPS_FINGERPRINT" ] || missing="$missing VPS_FINGERPRINT"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository Actions secret(s):$missing"
            exit 1
          fi
          case "$VPS_FINGERPRINT" in
            SHA256:*) ;;
            *) echo "::error::VPS_FINGERPRINT must start with SHA256:"; exit 1 ;;
          esac
          if ! printf '%s' "$VPS_SSH_KEY" | grep -Eq 'BEGIN (OPENSSH |RSA )?PRIVATE KEY'; then
            echo "::error::VPS_SSH_KEY is not a complete private key"
            exit 1
          fi

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_FINGERPRINT: ${{ secrets.VPS_FINGERPRINT }}
        run: |
          set -euo pipefail
          key_file="$(mktemp)"
          host_keys="$(mktemp)"
          trap 'rm -f "$key_file" "$host_keys"' EXIT

          printf '%s\n' "$VPS_SSH_KEY" >"$key_file"
          chmod 600 "$key_file"

          ssh-keyscan -T 10 -t ed25519 "$VPS_HOST" >"$host_keys" 2>/dev/null
          actual_fingerprint="$(ssh-keygen -lf "$host_keys" -E sha256 | awk '{print $2}')"
          if [ "$actual_fingerprint" != "$VPS_FINGERPRINT" ]; then
            echo "::error::VPS host fingerprint mismatch"
            exit 1
          fi

          install -d -m 700 "$HOME/.ssh"
          install -m 600 "$host_keys" "$HOME/.ssh/known_hosts"
          ssh \
            -i "$key_file" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USERNAME@$VPS_HOST" 'bash -se' <<'REMOTE_SCRIPT'
            export PATH="$HOME/.bun/bin:/usr/local/bin:$PATH"
            cd ~/beatsync
            git pull --ff-only origin main
            command -v pm2 >/dev/null || bun add --global pm2
            sudo env \
              PATH="$PATH" \
              PM2_BIN="$(command -v pm2)" \
              DEPLOY_USER="$(id -un)" \
              DEPLOY_HOME="$HOME" \
              bash scripts/configure-oracle-memory.sh
            SKIP_PULL=1 bash update.sh
          REMOTE_SCRIPT
